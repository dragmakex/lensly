services: 
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - hasura
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "9180"
    networks:
      - slop-shop
    volumes:
      - ./services/caddy/config/Caddyfile:/etc/caddy/Caddyfile
      - ./services/caddy/data:/data
      - ./services/caddy/static:/srv

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./services/postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: analytics
    expose:
      - "5432"
    networks:
      - slop-shop

  hasura:
    image: hasura/graphql-engine:latest
    container_name: hasura
    restart: unless-stopped
    depends_on:
      - postgres
    expose:
      - "8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://admin:password@postgres:5432/analytics
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_PASSWORD}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: unauthorized
    networks:
      - slop-shop


networks:
  slop-shop:
    driver: bridge